<!DOCTYPE html>
<html lang="hu" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
    <title>Naptár</title>
</head>

<body>
    <header>
        <section>
            <nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default">
                <div class="max-w-screen-xl flex flex-wrap items-center justify-between gap-x-3 gap-y-2 mx-auto p-4">
                    <p class="order-1 flex min-w-0 flex-1 items-center space-x-3 rtl:space-x-reverse">
                        <span class="self-center text-base sm:text-xl text-heading font-bold whitespace-nowrap">Jegykezelő
                            Rendszer</span>
                    </p>
                    <div class="order-3 ml-auto flex basis-full justify-end gap-2 md:order-2 md:basis-auto">
                        <button type="button"
                            class="text-white bg-gradient-to-r from-red-400 via-red-500 to-red-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 inline-flex h-10 w-10 md:h-auto md:w-auto items-center justify-center gap-2 px-0 md:px-4 py-2.5 font-medium rounded-base text-sm text-center leading-5">
                            <span aria-hidden="true">−</span>
                            <span class="hidden md:inline">Esemény törlése</span>
                        </button>
                        <button
                            class="text-white bg-gradient-to-r from-green-400 via-green-500 to-green-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-green-300 dark:focus:ring-green-800 inline-flex h-10 w-10 md:h-auto md:w-auto items-center justify-center gap-2 px-0 md:px-4 py-2.5 font-medium rounded-base text-sm text-center leading-5"
                            type="button" data-drawer-target="drawer-navigation" data-drawer-show="drawer-navigation"
                            aria-controls="drawer-navigation">
                            <span aria-hidden="true">+</span>
                            <span class="hidden md:inline">Esemény hozzáadása</span>
                        </button> <!-- AI javaslat: az "ml-auto" a gomb jobbra igazítására. A gomb stílusa saját -->
                    </div>

                    <div class="order-2 flex shrink-0 items-center space-x-3 md:order-3 md:space-x-0 rtl:space-x-reverse ms-0">
                        <div class="flex text-sm bg-neutral-primary rounded-full md:me-0 focus:ring-4 focus:ring-neutral-tertiary"
                            id="user-menu-button" aria-expanded="false" data-dropdown-placement="bottom">
                            <img class="w-8 h-8 rounded-full" src="img/logo.png" alt="logo photo">
                        </div>
                    </div>
                </div>
            </nav>
        </section>
    </header>
    <main class="min-h-screen pt-32 sm:pt-20 pb-24 px-4">
        <!-- AI (Claude) segítségével: a <main> elrendezése (h-screen pt-20 pb-24 px-4 flex flex-col) -->
        <section>
            <h2 class="text-center text-white font-bold text-3xl text-wrap py-4">Események Naptár</h2>
            <!-- drawer component -->
            <div id="drawer-navigation"
                class="fixed top-0 left-0 z-40 w-85 h-screen p-4 overflow-y-auto transition-transform -translate-x-full border-e border-default bg-neutral-800"
                tabindex="-1" aria-labelledby="drawer-navigation-label">
                <div class="border-b border-default pb-4 flex items-center">
                    <span class="self-center text-lg font-bold whitespace-nowrap text-heading">Esemény
                        Kezelés</span>
                    <button type="button" data-drawer-hide="drawer-navigation" aria-controls="drawer-navigation"
                        class="text-body bg-transparent hover:text-heading hover:bg-neutral-tertiary rounded-base w-9 h-9 absolute top-2.5 end-2.5 flex items-center justify-center">
                        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18 17.94 6M18 18 6.06 6" />
                        </svg>
                        <span class="sr-only">Bezárás</span>
                    </button>
                </div>
                <div class="py-6 overflow-y-auto">
                    <form class="max-w-sm mx-auto space-y-4 ">
                        <div>
                            <label for="visitors" class="block mb-2.5 text-sm font-semibold text-heading">Esemény
                                név:</label>
                            <input type="text" id="visitors"
                                class="esemenyNev bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-75 px-2.5 py-2 shadow-xs placeholder:text-body ml-1.5"
                                placeholder="" required />
                        </div>
                        <div>
                            <label for="visitors"
                                class="block mb-2.5 text-sm font-semibold text-heading">Helyszín:</label>
                            <input type="text" id="visitors"
                                class="helyszin bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-75 px-2.5 py-2 shadow-xs placeholder:text-body ml-1.5"
                                placeholder="" required />
                        </div>
                        <div>
                            <label for="visitors" class=" block mb-2.5 text-sm font-semibold text-heading">Maximális
                                létszám:</label>
                            <input type="number" id="visitors"
                                class="letszam bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-75 px-2.5 py-2 shadow-xs placeholder:text-body ml-1.5"
                                placeholder="" required />
                        </div>
                        <label for="message" class="block mb-2.5 text-sm font-medium text-heading">Esemény
                            leírás:</label>
                        <textarea id="message" rows="4"
                            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-75 p-3.5 shadow-xs placeholder:text-body ml-1.5"
                            placeholder="Leírás..."></textarea>

                        <label for="time" class="block mb-2.5 text-sm font-medium text-heading">Dátum:</label>
                        <div class="relative max-w-sm">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                    width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z" />
                                </svg>
                            </div>
                            <input id="datepicker-autohide" datepicker datepicker-autohide type="text"
                                class="datum block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand px-3 py-2.5 shadow-xs placeholder:text-body"
                                placeholder="Válasszon dátumot">
                        </div>
                        <div>
                            <label for="time" class="block mb-2.5 text-sm font-medium text-heading">Idő:</label>
                            <div class="relative max-w-sm">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                    <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                        width="24" height="24" fill="none" viewBox="0 0 24 24">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                            stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                    </svg>
                                </div>
                                <input type="time" id="time"
                                    class="ido block w-full ps-9 pe-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs [&::-webkit-calendar-picker-indicator]:hidden"
                                    min="09:00" max="18:00" value="09:00" required />
                            </div>
                        </div>
                </div>
                <div class="flex gap-3 mt-12">
                    <button type="button"
                        class="text-white bg-gradient-to-r from-green-400 via-green-500 to-green-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-green-300 dark:focus:ring-green-800 w-37.5 font-medium rounded-base text-sm px-4 py-2.5 text-center leading-5">Mentés</button>
                    <button type="button" data-modal-target="popup-modal" data-modal-toggle="popup-modal"
                        class="text-white bg-gradient-to-r from-red-400 via-red-500 to-red-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 w-37.5 font-medium rounded-base text-sm px-4 py-2.5 text-center leading-5">Mégse</button>
                    </form>
                </div>
            </div>
            <div class="grid md:grid-cols-[minmax(0,1fr)_300px] gap-4"> <!--[minmax(0,1fr)_300px] - AI ajánlás -->
                <!-- AI (Claude) által készítve: a naptár szerkezete (hónapváltó, napnevek, rács).
                        Saját módosítás: auto-rows-[140px], max-w-5xl wrapper -->
                <div class="w-full max-w-5xl mx-auto flex flex-col flex-1 min-h-0">
                    <div class="flex items-center justify-center gap-2 sm:gap-8 py-2">
                        <button id="prev-month" type="button"
                            class="shrink-0 text-heading text-2xl px-2 sm:px-3 rounded-base hover:bg-neutral-secondary-medium">‹</button>
                        <h2 id="month-title" class="min-w-0 flex-1 sm:flex-none text-lg sm:text-xl font-bold text-heading sm:w-56 text-center"></h2>
                        <button id="next-month" type="button"
                            class="shrink-0 text-heading text-2xl px-2 sm:px-3 rounded-base hover:bg-neutral-secondary-medium">›</button>
                    </div>

                    <div id="weekdays"
                        class="grid grid-cols-7 md:gap-2 text-center text-sm font-bold text-heading py-2"></div>

                    <div id="calendar-grid" class="grid grid-cols-7 md:auto-rows-[100px] gap-2 flex-1 min-h-0"></div>
                </div>
                <div class="py-4">
                    <div
                        class="bg-neutral-primary-soft block p-4 sm:p-6 border border-default rounded-base shadow-xs hover:bg-neutral-secondary-medium">
                        <h5 class="mb-3 text-xl sm:text-2xl font-semibold tracking-tight text-heading leading-8">Következő
                            eseményig: </h5>
                        <p class="text-body timer text-center text-bold"><span class="day">000</span>:<span
                                class="hour">00</span>:<span class="min">00</span>:<span class="sec">00</span></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <section>
            <div
                class="fixed z-50 w-full h-16 max-w-lg -translate-x-1/2 bg-neutral-primary-soft border border-default rounded-full bottom-4 left-1/2">
                <div class="grid h-full max-w-lg grid-cols-4 mx-auto">
                    <button data-tooltip-target="tooltip-home" type="button" onclick="location.href='/Index.html'"
                        class="inline-flex flex-col items-center justify-center px-5 rounded-s-full hover:bg-neutral-secondary-medium group">
                        <svg class="w-6 h-6 mb-1 text-body group-hover:text-fg-brand" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m4 12 8-8 8 8M6 10.5V19a1 1 0 0 0 1 1h3v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h3a1 1 0 0 0 1-1v-8.5" />
                        </svg>
                        <span class="sr-only">Főoldal</span>
                    </button>
                    <div id="tooltip-home" role="tooltip"
                        class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-dark rounded-base shadow-xs opacity-0 tooltip">
                        Főoldal
                        <div class="tooltip-arrow" data-popper-arrow></div>
                    </div>
                    <button data-tooltip-target="tooltip-wallet" type="button" onclick="location.href='/Naptar.html'"
                        class="inline-flex flex-col items-center justify-center px-5 hover:bg-neutral-secondary-medium group">
                        <svg class="w-6 h-6 mb-1 text-body group-hover:text-fg-brand" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z" />
                        </svg>
                        <span class="sr-only">Naptár</span>
                    </button>
                    <div id="tooltip-wallet" role="tooltip"
                        class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-dark rounded-base shadow-xs opacity-0 tooltip">
                        Naptár
                        <div class="tooltip-arrow" data-popper-arrow></div>
                    </div>
                    <button data-tooltip-target="tooltip-settings" type="button"
                        onclick="location.href='/Statisztika.html'"
                        class="inline-flex flex-col items-center justify-center px-5 hover:bg-neutral-secondary-medium group">
                        <svg class="w-6 h-6 mb-1 text-body group-hover:text-fg-brand" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 15v4m6-6v6m6-4v4m6-6v6M3 11l6-5 6 5 5.5-5.5" />
                        </svg>

                        <span class="sr-only">Statisztika</span>
                    </button>
                    <div id="tooltip-settings" role="tooltip"
                        class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-dark rounded-base shadow-xs opacity-0 tooltip">
                        Statisztika
                        <div class="tooltip-arrow" data-popper-arrow></div>
                    </div>
                    <button data-tooltip-target="tooltip-profile" type="button" onclick="location.href='/Arazas.html'"
                        class="inline-flex flex-col items-center justify-center px-5 rounded-e-full hover:bg-neutral-secondary-medium group">
                        <svg class="w-6 h-6 mb-1 text-body group-hover:text-fg-brand" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 10h18M6 14h2m3 0h5M3 7v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1Z" />
                        </svg>

                        <span class="sr-only">Árazás</span>
                    </button>
                    <div id="tooltip-profile" role="tooltip"
                        class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-dark rounded-base shadow-xs opacity-0 tooltip">
                        Árazás
                        <div class="tooltip-arrow" data-popper-arrow></div>
                    </div>
                </div>
            </div>
        </section>
    </footer>

    <div id="popup-modal" tabindex="-1"
        class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <div class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6">
                <button type="button"
                    class="absolute top-3 end-2.5 text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
                    data-modal-hide="popup-modal">
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18 17.94 6M18 18 6.06 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
                <div class="p-4 md:p-5 text-center">
                    <svg class="mx-auto mb-4 text-fg-disabled w-12 h-12" aria-hidden="true"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 13V8m0 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <h3 class="mb-6 text-body py-4">Biztosan vissza szeretné vonni az adatokat?</h3>
                    <div class="flex md:flex items-center space-x-4 justify-center">
                        <button data-modal-hide="popup-modal" type="button"
                            class="text-white bg-gradient-to-r from-green-400 via-green-500 to-green-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-green-300 dark:focus:ring-green-800 w-16 font-medium rounded-base text-sm px-4 py-2.5 text-center leading-5">
                            Igen
                        </button>
                        <button data-modal-hide="popup-modal" type="button"
                            class="text-white bg-gradient-to-r from-red-400 via-red-500 to-red-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-red-300 dark:focus:ring-red-800 w-16 font-medium rounded-base text-sm px-4 py-2.5 text-center ms-3 leading-5">Nem
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="./node_modules/flowbite/dist/flowbite.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
